<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment</title>

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#1e3a8a 0%,#0f172a 45%,#020617 100%);color:#f8fafc}
.container{max-width:460px;margin:auto;padding:25px 16px;min-height:100vh}
.header{text-align:center;padding:25px 0 30px}
.logo{width:60px;height:60px;border-radius:18px;object-fit:cover;display:none;margin:auto;box-shadow:0 10px 30px rgba(59,130,246,.35)}
.gateway{font-size:30px;font-weight:800;margin-top:10px;letter-spacing:-1px;background:linear-gradient(135deg,#fff,#93c5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:rgba(15,23,42,.82);border:1px solid rgba(148,163,184,.18);border-radius:28px;padding:28px 22px;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,.45);backdrop-filter:blur(15px)}
.amount{font-size:42px;font-weight:800;margin:12px 0;color:#fff}
.product{color:#94a3b8;margin-bottom:20px;font-size:16px}
.qr{width:240px;height:240px;object-fit:contain;margin:15px auto 25px;display:block;padding:12px;background:#fff;border-radius:18px}
.upi{display:block;width:100%;padding:16px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;text-decoration:none;font-weight:bold;box-shadow:0 10px 25px rgba(37,99,235,.35)}
.upi:active{transform:scale(.98)}
.divider{display:flex;align-items:center;gap:12px;color:#94a3b8;font-size:13px;margin:25px 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:#334155}
label{display:block;margin-bottom:8px;color:#cbd5e1;font-weight:bold}
input{width:100%;padding:15px;border:1px solid #334155;border-radius:14px;font-size:16px;outline:none;background:#020617;color:#fff}
input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.submit{width:100%;margin-top:14px;padding:16px;border:0;border-radius:14px;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;font-size:16px;font-weight:bold;box-shadow:0 10px 25px rgba(34,197,94,.25)}
.status{display:none;margin-top:18px;padding:13px;border-radius:12px;font-size:14px;font-weight:bold}
.info{margin-top:20px;text-align:center;color:#94a3b8;font-size:13px}
.order{font-size:12px;color:#64748b;word-break:break-all;margin-top:8px}
@media(max-width:400px){.card{padding:24px 16px}.qr{width:220px;height:220px}.amount{font-size:38px}}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <img id="logo" class="logo">
        <div id="gateway" class="gateway">
            MyGateway
        </div>
    </div>

    <div class="card">

        <div>Pay Amount</div>

        <div id="amount" class="amount">
            ₹0.00
        </div>

        <div id="product" class="product"></div>

        <img id="qr" class="qr" alt="Payment QR">

        <a id="upiButton" class="upi">
            Pay with UPI App
        </a>

        <div class="divider">
            After payment
        </div>

        <div style="text-align:left">
            <label>
                UTR / Transaction ID
            </label>

            <input
                id="utr"
                placeholder="Enter your UTR"
                autocomplete="off">
        </div>

        <button
            class="submit"
            onclick="submitUTR()">
            Submit Payment
        </button>

        <div id="status" class="status"></div>

        <div class="info">
            Please complete the payment before submitting UTR.
        </div>

        <div id="order" class="order"></div>

    </div>

</div>

<script>

const orderId =
    decodeURIComponent(
        location.pathname.split("/").pop()
    );

let currentOrder = null;

function showStatus(message,success){

    const box =
        document.getElementById("status");

    box.style.display = "block";
    box.innerText = message;

    box.style.background =
        success ? "#dcfce7" : "#fee2e2";

    box.style.color =
        success ? "#166534" : "#991b1b";
}

async function loadPayment(){

    try{

        const orderRes =
            await fetch(
                "/api/order/" +
                encodeURIComponent(orderId)
            );

        const orderData =
            await orderRes.json();

        if(!orderData.success){
            showStatus(
                "Order not found",
                false
            );
            return;
        }

        currentOrder = orderData.order;

        document.getElementById("amount")
            .innerText =
            "₹" +
            Number(currentOrder.amount)
                .toFixed(2);

        document.getElementById("product")
            .innerText =
            currentOrder.product || "";

        document.getElementById("order")
            .innerText =
            "Order ID: " +
            currentOrder.order_id;

        const settingsRes =
            await fetch("/api/settings");

        const settingsData =
            await settingsRes.json();

        if(settingsData.success){

            const s =
                settingsData.settings;

            document.getElementById("gateway")
                .innerText =
                s.gateway_name || "MyGateway";

            if(s.logo_url){

                const logo =
                    document.getElementById("logo");

                logo.src = s.logo_url;
                logo.style.display = "block";
            }
        }

        const qrRes =
            await fetch(
                "/api/payment/qr/" +
                encodeURIComponent(orderId)
            );

        const qrData =
            await qrRes.json();

        if(!qrData.success){

            showStatus(
                qrData.message,
                false
            );

            return;
        }

        document.getElementById("qr")
            .src = qrData.qr;

        document.getElementById("upiButton")
            .href = qrData.upiUrl;

    }catch(error){

        showStatus(
            "Unable to load payment",
            false
        );
    }
}

async function submitUTR(){

    const utr =
        document.getElementById("utr")
            .value.trim();

    if(utr.length < 6){

        showStatus(
            "Please enter a valid UTR.",
            false
        );

        return;
    }

    const button =
        document.querySelector(".submit");

    button.disabled = true;
    button.innerText = "Submitting...";

    try{

        const res =
            await fetch(
                "/api/order/" +
                encodeURIComponent(orderId) +
                "/utr",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                        "application/json"
                    },
                    body:JSON.stringify({
                        utr:utr
                    })
                }
            );

        const data =
            await res.json();

        if(data.success){

            showStatus(
                "UTR submitted. Payment is now under processing.",
                true
            );

            button.innerText =
                "Submitted";

        }else{

            showStatus(
                data.message ||
                "Submission failed.",
                false
            );

            button.disabled = false;
            button.innerText =
                "Submit Payment";
        }

    }catch(error){

        showStatus(
            "Network error. Please try again.",
            false
        );

        button.disabled = false;
        button.innerText =
            "Submit Payment";
    }
}

loadPayment();

</script>

</body>
</html>
